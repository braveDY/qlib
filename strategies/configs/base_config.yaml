# ======================================================================================
# 🎛️ Qlib 策略全局基准默认配置 (Base Configuration)
# 所有专项实验 (models / factors / strategies) 默认自动继承此配置，并仅需覆盖差异字段
# ======================================================================================

# 1. 股票池与对比基准
market: "csi500"                  # 股票池代码: 中证500成分股
benchmark: "SH000905"             # 策略基准指数代码: 中证500指数
benchmark_ma: 20                  # 基准指数均线周期 (用于大盘牛熊择时)

# 2. 预测周期与时间切片默认区间
label_horizon: 1                  # 默认预测未来 1 日收益率
train_start: "2008-01-01"         # 默认历史训练起始
train_end: "2024-12-31"           # 默认历史训练结束
valid_start: "2025-01-01"         # 默认验证集起始 (用于早停)
valid_end: "2025-06-30"           # 默认验证集结束
test_start: "2025-07-01"          # 统一样本外实盘测试起始
test_end: "2026-08-24"            # 统一样本外实盘测试结束

# 3. 账户资金与交易基本单位
account_cash: 20000.0             # 初始实盘模拟本金 (¥20,000)
topk_stocks: 1                    # 目标持仓股票数量 (Top 1 只)
n_drop_stocks: 1                  # 每次调仓卖出的最大股票数量
trade_unit: 100                   # 强制 A 股 1 手 (100 股) 交易整数倍限制
rebalance_days: 1                 # 调仓周期 (日频)
risk_degree: 0.95                 # 目标仓位上限 (95% 满仓运作)
only_main_board: true             # 仅限主板 (过滤 688 科创板与 300 创业板)

# 4. 交易费率与撮合规则
open_cost: 0.0001                 # 买入佣金费率: 万一 (0.01%)
close_cost: 0.0001                # 卖出佣金费率: 万一 (0.01%)
min_cost: 5.0                     # 最低单笔佣金门槛: 5 元 (支持万一免五时可设为 0)
deal_price: "close"               # 撮合成交价格: 每日收盘价
limit_threshold: 0.095            # 涨跌停判定阈值: 9.5% (涨停不可买，跌停不可卖)

# 5. 核心选股与主升浪通道过滤
stock_uptrend_filter: true        # 开启个股双多头通道过滤 (只买 Close > MA5 且 Close > MA20 主升浪)
drop_rank_threshold: 30           # 跌出预测打分前 30 名强制卖出淘汰

# 6. 多维风险控制与止损止盈
stop_loss_rate: 0.035             # 严格固定止损线: -3.5% 无条件市价平仓
trailing_stop_trigger: 0.05       # 移动止盈激活阈值: 浮盈达到 +5% 后启动跟踪止损
trailing_stop_rate: 0.025         # 跟踪止损回撤容忍度: 从最高点回撤 2.5% 锁定利润
max_holding_days: 10              # 最大持仓时间约束: 持有 10 个交易日后自动强制调仓

# 7. 宏观择时与账户回撤锁定
market_timing_mode: "half_position_timing" # 择时模式: 大盘 < MA20 弱势期自动减半仓
account_drawdown_limit: 0.08      # 账户高水位回撤保护: 累计净值从高点回撤 8% 紧缩防守

# 8. 默认基模型配置 (LightGBM)
model:
  class: "LGBModel"
  module_path: "qlib.contrib.model.gbdt"
  kwargs:
    loss: "mse"
    colsample_bytree: 0.8879
    learning_rate: 0.0421
    subsample: 0.8789
    lambda_l1: 205.6999
    lambda_l2: 580.9768
    max_depth: 8
    num_leaves: 210
    num_threads: 20
    seed: 42
    bagging_seed: 42
    feature_fraction_seed: 42
