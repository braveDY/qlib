# ======================================================================================
# 🚀 相对强度动量策略 (RS Momentum Strategy)
# 特点: 5日标签 + 17年训练 + Alpha158 + 相对中证500的 RS 动量超额因子 + 完整风控
# ======================================================================================

key: "rs_momentum"
title: "RS 相对强度动量策略 (5日标签 + 17年 + RS超额因子 + 完整风控)"
description: "在 Alpha158 基础上动态追加个股相对中证500基准的 RS 相对强度动量特征 (5/10/20/60日)"

market: "csi500"
benchmark: "SH000905"
benchmark_ma: 20
label_horizon: 5
rs_horizons:
  - 5
  - 10
  - 20
  - 60
train_start: "2008-01-01"
train_end: "2024-12-31"
valid_start: "2025-01-01"
valid_end: "2025-06-30"
test_start: "2025-07-01"
test_end: "2026-08-24"

account_cash: 20000.0
topk_stocks: 1
n_drop_stocks: 1
trade_unit: 100
risk_degree: 0.95
open_cost: 0.0001
close_cost: 0.0001
min_cost: 5.0
deal_price: "close"
limit_threshold: 0.095

stock_uptrend_filter: true
drop_rank_threshold: 30
stop_loss_rate: 0.035
trailing_stop_trigger: 0.05
trailing_stop_rate: 0.025
max_holding_days: 10
market_timing_mode: "half_position_timing"
account_drawdown_limit: 0.08

model:
  class: "LGBModel"
  module_path: "qlib.contrib.model.gbdt"
  kwargs:
    loss: "mse"
    learning_rate: 0.0421
    max_depth: 8
    num_leaves: 210
    subsample: 0.8789
    colsample_bytree: 0.8879
    lambda_l1: 205.6999
    lambda_l2: 580.9768
    num_threads: 20
    seed: 42
    bagging_seed: 42
    feature_fraction_seed: 42
